<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pension Tracker</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f6f7f9;
      color: #1d2433;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #12161f; color: #e6e9ef; }
    }
    main { text-align: center; padding: 0 16px; }
    h1 { font-size: clamp(2rem, 6vw, 3.25rem); margin: 0 0 .5rem; }
    p { margin: 0; opacity: .75; }
  </style>
</head>
<body>
  <main>
    <h1>Hello, world</h1>
    <p>Pension Tracker is coming soon.</p>
  </main>
</body>
</html>
