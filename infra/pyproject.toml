[project]
name = "pension-tracker-infra"
version = "0.1.0"
description = "AWS CDK (Python) infrastructure for pensionTracker"
requires-python = ">=3.13"
dependencies = [
    "aws-cdk-lib>=2.273.0,<3.0.0",
    "constructs>=10.5.0,<11.0.0",
    "cdk-nag>=2.37.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.13",
    "mypy>=1.18",
    "pip-audit>=2.9",
]

# `infra` is an app, not a library to publish: uv just manages its virtualenv.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The coverage gate from the Definition of Done: the test run fails below 90%.
addopts = "--cov=pension_tracker_infra --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N"]

[tool.ruff.lint.per-file-ignores]
# `assert` is how pytest tests are written.
"tests/**" = ["S101"]

[tool.mypy]
strict = true
